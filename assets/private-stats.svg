<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-labelledby="title desc">
  <title id="title">Private contribution stats</title>
  <desc id="desc">Waiting for the first authenticated refresh. No fixed numeric statistics are displayed.</desc>
  <rect width="880" height="180" rx="20" fill="#0d1117"/>
  <rect x=".5" y=".5" width="879" height="179" rx="20" fill="none" stroke="#30363d"/>
  <g font-family="Arial, sans-serif">
    <text x="32" y="48" fill="#f0f6fc" font-size="25" font-weight="700">PRIVATE WORK / PUBLIC NUMBERS</text>
    <text x="32" y="87" fill="#58a6ff" font-size="18">Automatic statistics · first refresh pending</text>
    <text x="32" y="121" fill="#8b949e" font-size="14">Aggregate commits, pull requests, and activity · no private repository details</text>
    <text x="32" y="153" fill="#8b949e" font-size="12">Refreshes every 6 hours once private read access is configured.</text>
  </g>
</svg>
